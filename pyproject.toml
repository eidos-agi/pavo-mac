[project]
name = "pavofront"
version = "0.1.0"
description = "Pavo Mac mock-first core — Plaud ingest, OMF/OANF packs"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pavofront = "pavofront.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pavofront*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
